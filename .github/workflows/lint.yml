name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black
          
      - name: Check formatting with Black
        id: black-check
        run: black --check .
        continue-on-error: true
        
      - name: Fix formatting with Black
        if: steps.black-check.outcome == 'failure'
        run: black .
        
      - name: Commit changes
        if: steps.black-check.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Apply Black formatting"